global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Monitorización del propio Prometheus
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Monitorización de tu API en NestJS
  - job_name: "nestjs_backend"
    metrics_path: "/metrics"  # Ajusta la ruta si usas un prefijo como /api/v1/metrics
    scrape_interval: 5s
    static_configs:
      - targets: ["backend:3000"]  