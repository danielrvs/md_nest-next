services:
  backend:
    build:
      context: ../
      dockerfile: infrastructure/backend/Dockerfile.dev
    container_name: md_nestjs
    image: md_backend:1.0
    ports:
      - "3000:3000"
      - "9229:9229"
    volumes:
      - ../backend:/usr/src/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - md_nest_next

  frontend:
    build:
      context: ../
      dockerfile: infrastructure/frontend/Dockerfile.dev
    container_name: md_nextjs
    image: md_frontend:1.0
    ports:
      - "3002:3000"
    volumes:
      - ../frontend:/usr/src/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - md_nest_next

  db:
    image: postgres:18-alpine
    container_name: md_nest_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - md_nest_next

  redis:
    image: redis:8.4.4-alpine3.22
    container_name: md_nest_redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - md_nest_next

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: md_nest_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - md_nest_next

  minio:
    image: minio/minio:latest
    container_name: md_nest_minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    networks:
      - md_nest_next

  mailpit:
    image: axllent/mailpit
    container_name: md_nest_mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - md_nest_next

  prometheus:
    image: prom/prometheus:latest
    container_name: md_nest_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ../observability/prometheus:/etc/prometheus
    networks:
      - md_nest_next

  grafana:
    image: grafana/grafana:latest
    container_name: md_nest_grafana
    ports:
      - "3003:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - md_nest_next

networks:
  md_nest_next:
    driver: bridge

volumes:
  pgdata:
  redis_data:
  minio_data:
  grafana_data:
